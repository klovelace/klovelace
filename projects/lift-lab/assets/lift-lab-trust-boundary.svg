<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="t d"><title id="t">Lift Lab AI trust boundary</title><desc id="d">Two columns listing what the AI planner and challenger may and may not do, and how the boundary is enforced.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1200" height="560" fill="#FFFFFF"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" y="36.0">The trust boundary: what the AI may and may not do</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6573" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" y="66.0">Written into the architecture and tested, not left to prompt wording.</tspan></text><rect x="40" y="96" width="540" height="330" rx="14" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#6B4FBB" text-anchor="middle" dominant-baseline="middle"><tspan x="310" y="128.0">AI planner and challenger MAY</tspan></text><circle cx="74" cy="178" r="5" fill="#6B4FBB"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="92" y="178.0">Turn a plain-language question into a causal question and decision</tspan></text><circle cx="74" cy="230" r="5" fill="#6B4FBB"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="92" y="230.0">Propose 2–4 candidate design families</tspan></text><circle cx="74" cy="282" r="5" fill="#6B4FBB"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="92" y="282.0">Describe mechanisms, arms, guardrails and assumptions</tspan></text><circle cx="74" cy="334" r="5" fill="#6B4FBB"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="92" y="334.0">Name which empirical inputs power will need</tspan></text><circle cx="74" cy="386" r="5" fill="#6B4FBB"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="92" y="386.0">Adversarially critique every candidate design</tspan></text><rect x="620" y="96" width="540" height="330" rx="14" fill="#FDECEC" stroke="#B42318" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#B42318" text-anchor="middle" dominant-baseline="middle"><tspan x="890" y="128.0">The AI may NOT</tspan></text><circle cx="654" cy="178" r="5" fill="#B42318"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="672" y="178.0">Calculate or guess sample size, power, MDE, baselines or alpha</tspan></text><circle cx="654" cy="230" r="5" fill="#B42318"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="672" y="230.0">Approve or freeze a design</tspan></text><circle cx="654" cy="282" r="5" fill="#B42318"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="672" y="282.0">Override a deterministic check</tspan></text><circle cx="654" cy="334" r="5" fill="#B42318"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="672" y="334.0">Use post-treatment variables as adjustment covariates</tspan></text><circle cx="654" cy="386" r="5" fill="#B42318"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="start" dominant-baseline="middle"><tspan x="672" y="386.0">Choose a design on the owner's behalf</tspan></text><rect x="40" y="448" width="1120" height="92" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="bold" fill="#1F5F99" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" y="474.0">How it is enforced</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="600.0" y="498.0">Strict JSON-schema outputs with no approval or power-result fields  ·  only power_engine.py computes N and MDE  ·</tspan><tspan x="600.0" y="518.0">warnings need a written human rationale  ·  each field is tagged as AI-proposed or owner-locked</tspan></text></svg>