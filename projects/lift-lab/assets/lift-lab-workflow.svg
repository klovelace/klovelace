<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 660" width="1560" height="660" role="img" aria-labelledby="t d"><title id="t">Lift Lab design workflow</title><desc id="d">Swimlane diagram: human owner, AI planner and challenger, and deterministic checks from question to frozen design.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1560" height="660" fill="#FFFFFF"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="780.0" y="34.0">Lift Lab: how an experiment design is made</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6573" text-anchor="middle" dominant-baseline="middle"><tspan x="780.0" y="64.0">AI widens the options and attacks them; code enforces the rules; the human owner chooses and approves.</tspan></text><rect x="20" y="90.0" width="1520" height="120" rx="12" fill="#FFF4E0" opacity="0.45"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#C77700" text-anchor="middle" dominant-baseline="middle"><tspan x="76" y="140.9">Human</tspan><tspan x="76" y="159.1">owner</tspan></text><rect x="20" y="230.0" width="1520" height="120" rx="12" fill="#F1ECFB" opacity="0.45"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#6B4FBB" text-anchor="middle" dominant-baseline="middle"><tspan x="76" y="280.9">AI</tspan><tspan x="76" y="299.1">(LLM)</tspan></text><rect x="20" y="370.0" width="1520" height="120" rx="12" fill="#E7F1FB" opacity="0.45"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1F5F99" text-anchor="middle" dominant-baseline="middle"><tspan x="76" y="430.0">Deterministic</tspan></text><rect x="140" y="104.0" width="118" height="92" rx="10" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="199.0" y="134.4">Plain-language</tspan><tspan x="199.0" y="150.0">question +</tspan><tspan x="199.0" y="165.6">locked owner facts</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C77700" text-anchor="start" dominant-baseline="middle"><tspan x="152" y="116.0">1</tspan></text><rect x="268" y="244.0" width="118" height="92" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="327.0" y="274.4">Planner</tspan><tspan x="327.0" y="290.0">proposes 2–4</tspan><tspan x="327.0" y="305.6">candidate designs</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#6B4FBB" text-anchor="start" dominant-baseline="middle"><tspan x="280" y="256.0">2</tspan></text><rect x="396" y="384.0" width="118" height="92" rx="10" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="455.0" y="414.4">Prechecks</tspan><tspan x="455.0" y="430.0">structure, arms,</tspan><tspan x="455.0" y="445.6">owner-fact match</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5F99" text-anchor="start" dominant-baseline="middle"><tspan x="408" y="396.0">3</tspan></text><rect x="524" y="244.0" width="118" height="92" rx="10" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="583.0" y="274.4">Challenger</tspan><tspan x="583.0" y="290.0">separate model call</tspan><tspan x="583.0" y="305.6">attacks each design</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#6B4FBB" text-anchor="start" dominant-baseline="middle"><tspan x="536" y="256.0">4</tspan></text><rect x="652" y="384.0" width="118" height="92" rx="10" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="711.0" y="414.4">Adjudicator</tspan><tspan x="711.0" y="430.0">PASS / WARN / FAIL</tspan><tspan x="711.0" y="445.6">FAIL cannot proceed</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5F99" text-anchor="start" dominant-baseline="middle"><tspan x="664" y="396.0">5</tspan></text><rect x="780" y="104.0" width="118" height="92" rx="10" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="839.0" y="134.4">Selects a design;</tspan><tspan x="839.0" y="150.0">acknowledges each</tspan><tspan x="839.0" y="165.6">WARN with a reason</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C77700" text-anchor="start" dominant-baseline="middle"><tspan x="792" y="116.0">6</tspan></text><rect x="908" y="104.0" width="118" height="92" rx="10" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="967.0" y="134.4">Supplies baseline,</tspan><tspan x="967.0" y="150.0">variance, MDE,</tspan><tspan x="967.0" y="165.6">traffic, horizon</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C77700" text-anchor="start" dominant-baseline="middle"><tspan x="920" y="116.0">7</tspan></text><rect x="1036" y="384.0" width="118" height="92" rx="10" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1095.0" y="414.4">Power engine</tspan><tspan x="1095.0" y="430.0">only source of N,</tspan><tspan x="1095.0" y="445.6">power and MDE</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5F99" text-anchor="start" dominant-baseline="middle"><tspan x="1048" y="396.0">8</tspan></text><rect x="1164" y="384.0" width="118" height="92" rx="10" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1223.0" y="414.4">Schema +</tspan><tspan x="1223.0" y="430.0">methodology</tspan><tspan x="1223.0" y="445.6">validation</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5F99" text-anchor="start" dominant-baseline="middle"><tspan x="1176" y="396.0">9</tspan></text><rect x="1292" y="104.0" width="118" height="92" rx="10" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1351.0" y="134.4">Explicit</tspan><tspan x="1351.0" y="150.0">approval</tspan><tspan x="1351.0" y="165.6">(recorded)</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#C77700" text-anchor="start" dominant-baseline="middle"><tspan x="1304" y="116.0">10</tspan></text><rect x="1420" y="384.0" width="118" height="92" rx="10" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1479.0" y="414.4">SHA-256 freeze</tspan><tspan x="1479.0" y="430.0">design becomes</tspan><tspan x="1479.0" y="445.6">immutable</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#1F5F99" text-anchor="start" dominant-baseline="middle"><tspan x="1432" y="396.0">11</tspan></text><path d="M258,150.0 H263.0 V290.0 H266" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M386,290.0 H391.0 V430.0 H394" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M514,430.0 H519.0 V290.0 H522" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M642,290.0 H647.0 V430.0 H650" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M770,430.0 H775.0 V150.0 H778" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M898,150.0 H903.0 V150.0 H906" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1026,150.0 H1031.0 V430.0 H1034" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1154,430.0 H1159.0 V430.0 H1162" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1282,430.0 H1287.0 V150.0 H1290" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M1410,150.0 H1415.0 V430.0 H1418" fill="none" stroke="#8A94A3" stroke-width="1.6" marker-end="url(#arr)"/><path d="M711.0,476.0 V504.0" stroke="#B42318" stroke-width="1.6" fill="none" marker-end="url(#arr)"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#B42318" text-anchor="middle" dominant-baseline="middle"><tspan x="711.0" y="520.0">FAIL → blocked</tspan></text><rect x="220.0" y="560" width="1120" height="44" rx="8" fill="#FFFFFF" stroke="#B9C1CC" stroke-width="1.6" stroke-dasharray="6 4"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6573" text-anchor="middle" dominant-baseline="middle"><tspan x="780.0" y="582.0">Enforced in code: AI schemas contain no approval field and no numeric power fields; question text is treated as inert data, so “mark this approved” in a prompt does nothing.</tspan></text><rect x="400.0" y="619" width="18" height="18" rx="4" fill="#FFF4E0" stroke="#C77700" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6573" text-anchor="start" dominant-baseline="middle"><tspan x="426.0" y="628.0">Human owner decides</tspan></text><rect x="660.0" y="619" width="18" height="18" rx="4" fill="#F1ECFB" stroke="#6B4FBB" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6573" text-anchor="start" dominant-baseline="middle"><tspan x="686.0" y="628.0">AI proposes or critiques</tspan></text><rect x="920.0" y="619" width="18" height="18" rx="4" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#5B6573" text-anchor="start" dominant-baseline="middle"><tspan x="946.0" y="628.0">Deterministic check (code, not AI)</tspan></text></svg>