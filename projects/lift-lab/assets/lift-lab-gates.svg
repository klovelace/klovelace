<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d"><title id="t">Lift Lab deterministic gates</title><desc id="d">Six fail-closed gates: design adjudication, power firewall, freeze, verified assignment, launch gate, frozen analysis and review.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8A94A3"/></marker></defs><rect width="1280" height="640" fill="#FFFFFF"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="36.0">Deterministic gates from design to decision</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#5B6573" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="66.0">Every gate fails closed. There is no partially ready state and no “latest contract wins” override.</tspan></text><rect x="40" y="100" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="40" y="100" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="40" y="130" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="60" y="124.0">1  Design adjudication</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="230.0" y="190.0">Fails closed on invalid arm/control</tspan><tspan x="230.0" y="212.0">structure, unsafe randomization units,</tspan><tspan x="230.0" y="234.0">carryover, endogenous dose, or no</tspan><tspan x="230.0" y="256.0">validated analysis path</tspan></text><rect x="450" y="100" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="450" y="100" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="450" y="130" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="470" y="124.0">2  Power firewall</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="190.0">Required N, achieved power, MDE,</tspan><tspan x="640.0" y="212.0">allocation and readout timing come</tspan><tspan x="640.0" y="234.0">only from the deterministic</tspan><tspan x="640.0" y="256.0">engine, using human-supplied inputs</tspan></text><rect x="860" y="100" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="860" y="100" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="860" y="130" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="880" y="124.0">3  Freeze</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" y="190.0">Analysis, metric and validity contracts</tspan><tspan x="1050.0" y="212.0">must agree; SHA-256 manifest detects</tspan><tspan x="1050.0" y="234.0">any later change; data bindings map</tspan><tspan x="1050.0" y="256.0">columns but cannot change meaning</tspan></text><rect x="40" y="380" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="40" y="380" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="40" y="410" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="60" y="404.0">4  Verified assignment</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="230.0" y="470.0">Assignment export is rebuilt from the</tspan><tspan x="230.0" y="492.0">eligibility snapshot and events with</tspan><tspan x="230.0" y="514.0">an HMAC secret and frozen salt;</tspan><tspan x="230.0" y="536.0">corrupted assignment data is rejected</tspan></text><rect x="450" y="380" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="450" y="380" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="450" y="410" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="470" y="404.0">5  Launch gate</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="640.0" y="470.0">LAUNCH_READY only if packet integrity,</tspan><tspan x="640.0" y="492.0">power/inference reconciliation,</tspan><tspan x="640.0" y="514.0">assignment, instrumentation probe and</tspan><tspan x="640.0" y="536.0">governance (ethics, privacy, prereg) pass</tspan></text><rect x="860" y="380" width="380" height="200" rx="14" fill="#E7F1FB" stroke="#1F5F99" stroke-width="1.6"/><rect x="860" y="380" width="380" height="46" rx="14" fill="#1F5F99"/><rect x="860" y="410" width="380" height="16" fill="#1F5F99"/><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="bold" fill="#FFFFFF" text-anchor="start" dominant-baseline="middle"><tspan x="880" y="404.0">6  Frozen analysis and review</tspan></text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="normal" fill="#1B2430" text-anchor="middle" dominant-baseline="middle"><tspan x="1050.0" y="470.0">Prespecified estimator and metric family;</tspan><tspan x="1050.0" y="492.0">SRM, balance and missingness flags;</tspan><tspan x="1050.0" y="514.0">AI critic reviews results, bounded by</tspan><tspan x="1050.0" y="536.0">a deterministic ship/no-ship policy</tspan></text><path d="M422,200.0 H448" stroke="#8A94A3" stroke-width="2" marker-end="url(#arr)"/><path d="M832,200.0 H858" stroke="#8A94A3" stroke-width="2" marker-end="url(#arr)"/><path d="M1050.0,302 V340 H230.0 V378" fill="none" stroke="#8A94A3" stroke-width="2" marker-end="url(#arr)"/><path d="M422,480.0 H448" stroke="#8A94A3" stroke-width="2" marker-end="url(#arr)"/><path d="M832,480.0 H858" stroke="#8A94A3" stroke-width="2" marker-end="url(#arr)"/></svg>