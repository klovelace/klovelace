<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><rect width="1200" height="550" fill="#f8f7f3"/><text x="48" y="60" fill="#123b3c" font-size="32" font-weight="bold" font-family="Arial">CAN THE MODEL BEAT GEOGRAPHIC MEMORY?</text><text x="48" y="96" fill="#536765" font-size="17" font-family="Arial">A distance-only null tests whether prediction is just proximity to previous records.</text><rect x="48" y="147" width="267" height="272" rx="18" fill="#e5eee9" stroke="#b7c9c3"/><circle cx="80" cy="181" r="17" fill="#174e50"/><text x="80" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">1</text><text x="67" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Freeze training</text><text x="67" y="271" font-size="16" fill="#314f4d" font-family="Arial">Records through 2021</text><text x="67" y="299" font-size="16" fill="#314f4d" font-family="Arial">Exclude test county</text><text x="67" y="327" font-size="16" fill="#314f4d" font-family="Arial">from all model fitting</text><text x="318" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="340" y="147" width="267" height="272" rx="18" fill="#e8ede8" stroke="#b7c9c3"/><circle cx="372" cy="181" r="17" fill="#174e50"/><text x="372" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">2</text><text x="359" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Future test set</text><text x="359" y="271" font-size="16" fill="#314f4d" font-family="Arial">2022–2026 records</text><text x="359" y="299" font-size="16" fill="#314f4d" font-family="Arial">At least 1 km from</text><text x="359" y="327" font-size="16" fill="#314f4d" font-family="Arial">historical occurrences</text><text x="610" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="632" y="147" width="267" height="272" rx="18" fill="#e5eee9" stroke="#b7c9c3"/><circle cx="664" cy="181" r="17" fill="#174e50"/><text x="664" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">3</text><text x="651" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Distance-only null</text><text x="651" y="271" font-size="16" fill="#314f4d" font-family="Arial">Rank test landscapes</text><text x="651" y="299" font-size="16" fill="#314f4d" font-family="Arial">only by proximity to</text><text x="651" y="327" font-size="16" fill="#314f4d" font-family="Arial">training occurrences</text><text x="902" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="924" y="147" width="267" height="272" rx="18" fill="#e8ede8" stroke="#b7c9c3"/><circle cx="956" cy="181" r="17" fill="#174e50"/><text x="956" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">4</text><text x="943" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">External comparison</text><text x="943" y="271" font-size="16" fill="#314f4d" font-family="Arial">Effort RF versus null</text><text x="943" y="299" font-size="16" fill="#314f4d" font-family="Arial">County-median rank</text><text x="943" y="327" font-size="16" fill="#314f4d" font-family="Arial">20,000 county bootstraps</text><text x="48" y="477" font-size="17" fill="#5c6d67" font-family="Arial">The null uses no environmental predictors. Higher rank for future records is better.</text></svg>