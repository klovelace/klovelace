<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="660" viewBox="0 0 1500 660" role="img" aria-labelledby="title desc"><title id="title">Holdout transfer effects for three forest-herb species</title><desc id="desc">County-balanced mean future-landscape percentile differences, effort-aware random forest minus distance-only null. Bloodroot 0.158, confidence interval 0.030 to 0.280; mayapple 0.157, interval 0.068 to 0.241; black cohosh negative 0.342 in one county, no interval.</desc><rect width="1500" height="660" fill="#fff"/><text x="64" y="65" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#142339" font-weight="700" >TRANSFER TEST: ENVIRONMENT VS. DISTANCE</text><text x="64" y="106" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#526476" font-weight="400" >Difference in county-median landscape percentiles, effort-aware random forest minus spatial-proximity null</text><line x1="64" y1="126" x2="1436" y2="126" stroke="#d7e1ea" stroke-width="2" /><text x="65" y="164" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#526476" font-weight="700" >SPECIES / HOLDOUT SCOPE</text><text x="1120" y="164" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#0a887b" font-weight="700" >FAVORS ENVIRONMENT</text><text x="350" y="164" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#cc8646" font-weight="700" >FAVORS DISTANCE</text><line x1="390" y1="185" x2="390" y2="523" stroke="#e6eaf0" stroke-width="1" /><text x="390" y="555" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#526476" font-weight="500" text-anchor="middle">-0.4</text><line x1="630" y1="185" x2="630" y2="523" stroke="#e6eaf0" stroke-width="1" /><text x="630" y="555" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#526476" font-weight="500" text-anchor="middle">-0.2</text><line x1="870" y1="185" x2="870" y2="523" stroke="#425166" stroke-width="3" stroke-dasharray="7 5"/><text x="870" y="555" font-family="Arial,Helve