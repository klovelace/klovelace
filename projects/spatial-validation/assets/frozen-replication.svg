<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 550" role="img"><rect width="1200" height="550" fill="#f8f7f3"/><text x="48" y="60" fill="#123b3c" font-size="32" font-weight="bold" font-family="Arial">FROZEN REPLICATION, INCLUDING FAILURE</text><text x="48" y="96" fill="#536765" font-size="17" font-family="Arial">Design choices were fixed before evaluating the additional target species.</text><rect x="48" y="147" width="267" height="272" rx="18" fill="#e5eee9" stroke="#b7c9c3"/><circle cx="80" cy="181" r="17" fill="#174e50"/><text x="80" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">1</text><text x="67" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Specify upfront</text><text x="67" y="271" font-size="16" fill="#314f4d" font-family="Arial">Core-12 predictors</text><text x="67" y="299" font-size="16" fill="#314f4d" font-family="Arial">60 m grid, 23 counties</text><text x="67" y="327" font-size="16" fill="#314f4d" font-family="Arial">Temporal split</text><text x="318" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="340" y="147" width="267" height="272" rx="18" fill="#e8ede8" stroke="#b7c9c3"/><circle cx="372" cy="181" r="17" fill="#174e50"/><text x="372" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">2</text><text x="359" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Preserve protocol</text><text x="359" y="271" font-size="16" fill="#314f4d" font-family="Arial">500 trees, seed 42</text><text x="359" y="299" font-size="16" fill="#314f4d" font-family="Arial">5:1 background ratio</text><text x="359" y="327" font-size="16" fill="#314f4d" font-family="Arial">Whole-county holdout</text><text x="610" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="632" y="147" width="267" height="272" rx="18" fill="#e5eee9" stroke="#b7c9c3"/><circle cx="664" cy="181" r="17" fill="#174e50"/><text x="664" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">3</text><text x="651" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Define success</text><text x="651" y="271" font-size="16" fill="#314f4d" font-family="Arial">Effort RF minus null</text><text x="651" y="299" font-size="16" fill="#314f4d" font-family="Arial">Positive mean difference</text><text x="651" y="327" font-size="16" fill="#314f4d" font-family="Arial">95% CI above zero</text><text x="902" y="300" font-size="23" fill="#b17842" font-family="Arial">›</text><rect x="924" y="147" width="267" height="272" rx="18" fill="#e8ede8" stroke="#b7c9c3"/><circle cx="956" cy="181" r="17" fill="#174e50"/><text x="956" y="187" font-size="16" fill="white" text-anchor="middle" font-family="Arial">4</text><text x="943" y="229" font-size="21" font-weight="bold" fill="#153b3c" font-family="Arial">Report all outcomes</text><text x="943" y="271" font-size="16" fill="#314f4d" font-family="Arial">Bloodroot: positive</text><text x="943" y="299" font-size="16" fill="#314f4d" font-family="Arial">Mayapple: replicated</text><text x="943" y="327" font-size="16" fill="#314f4d" font-family="Arial">Cohosh: not replicated</text><text x="48" y="477" font-size="17" fill="#5c6d67" font-family="Arial">Black cohosh qualified in only one county; its result is descriptive, not a species-wide estimate.</text></svg>