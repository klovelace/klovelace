<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="590" viewBox="0 0 1680 590" role="img" aria-labelledby="title desc"><title id="title">Spatial modeling and geographic validation workflow</title><desc id="desc">Four stages: GIS stack, frozen occurrence audit, random forest and distance-null model comparison, and temporally future whole-county holdout validation.</desc><rect width="1680" height="590" fill="#fff"/><text x="64" y="65" font-family="Arial,Helvetica,sans-serif" font-size="39" fill="#142339" font-weight="700" >GEOSPATIAL RESEARCH WORKFLOW</text><text x="64" y="106" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#526476" font-weight="400" >From opportunistic species observations to a deliberately difficult test of geographic transfer</text><line x1="64" y1="126" x2="1616" y2="126" stroke="#d7e1ea" stroke-width="2" /><rect x="64" y="162" width="370" height="320" rx="14" fill="#f7fafc" stroke="#dae3ec"/><rect x="64" y="162" width="8" height="320" rx="3" fill="#4572a9" stroke="none"/><text x="91" y="201" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#4572a9" font-weight="700" >01 / GIS stack</text><text x="91" y="243" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#142339" font-weight="700" >Build the landscape</text><circle cx="100" cy="283" r="4" fill="#4572a9"/><text x="117" y="290" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >23 Western NC counties</text><circle cx="100" cy="318" r="4" fill="#4572a9"/><text x="117" y="325" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >EPSG:5070, 60 m grid</text><circle cx="100" cy="353" r="4" fill="#4572a9"/><text x="117" y="360" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >USGS terrain and hydrology</text><circle cx="100" cy="388" r="4" fill="#4572a9"/><text x="117" y="395" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >NLCD canopy, PRISM climate</text><circle cx="100" cy="423" r="4" fill="#4572a9"/><text x="117" y="430" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Core-12 predictors frozen</text><line x1="441" y1="327" x2="460" y2="327" stroke="#8095a8" stroke-width="3" /><path d="M456 318 l10 9 l-10 9" fill="none" stroke="#8095a8" stroke-width="3"/><rect x="469" y="162" width="370" height="320" rx="14" fill="#f7fafc" stroke="#dae3ec"/><rect x="469" y="162" width="8" height="320" rx="3" fill="#0a887b" stroke="none"/><text x="496" y="201" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#0a887b" font-weight="700" >02 / Occurrence audit</text><text x="496" y="243" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#142339" font-weight="700" >Separate time and space</text><circle cx="505" cy="283" r="4" fill="#0a887b"/><text x="522" y="290" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Research Grade iNaturalist</text><circle cx="505" cy="318" r="4" fill="#0a887b"/><text x="522" y="325" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Training through 2021</text><circle cx="505" cy="353" r="4" fill="#0a887b"/><text x="522" y="360" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Future records: 2022 to 2026</text><circle cx="505" cy="388" r="4" fill="#0a887b"/><text x="522" y="395" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Future records &gt;=1 km away</text><circle cx="505" cy="423" r="4" fill="#0a887b"/><text x="522" y="430" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Entire test county withheld</text><line x1="846" y1="327" x2="865" y2="327" stroke="#8095a8" stroke-width="3" /><path d="M861 318 l10 9 l-10 9" fill="none" stroke="#8095a8" stroke-width="3"/><rect x="874" y="162" width="370" height="320" rx="14" fill="#f7fafc" stroke="#dae3ec"/><rect x="874" y="162" width="8" height="320" rx="3" fill="#cc8646" stroke="none"/><text x="901" y="201" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#cc8646" font-weight="700" >03 / Model comparison</text><text x="901" y="243" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#142339" font-weight="700" >Challenge the shortcut</text><circle cx="910" cy="283" r="4" fill="#cc8646"/><text x="927" y="290" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Uniform-background RF</text><circle cx="910" cy="318" r="4" fill="#cc8646"/><text x="927" y="325" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Observer-effort RF</text><circle cx="910" cy="353" r="4" fill="#cc8646"/><text x="927" y="360" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Distance-only null</text><circle cx="910" cy="388" r="4" fill="#cc8646"/><text x="927" y="395" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >500 trees, fixed settings</text><circle cx="910" cy="423" r="4" fill="#cc8646"/><text x="927" y="430" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >No performance-driven tuning</text><line x1="1251" y1="327" x2="1270" y2="327" stroke="#8095a8" stroke-width="3" /><path d="M1266 318 l10 9 l-10 9" fill="none" stroke="#8095a8" stroke-width="3"/><rect x="1279" y="162" width="370" height="320" rx="14" fill="#f7fafc" stroke="#dae3ec"/><rect x="1279" y="162" width="8" height="320" rx="3" fill="#142339" stroke="none"/><text x="1306" y="201" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#142339" font-weight="700" >04 / Validation</text><text x="1306" y="243" font-family="Arial,Helvetica,sans-serif" font-size="26" fill="#142339" font-weight="700" >Measure transfer</text><circle cx="1315" cy="283" r="4" fill="#142339"/><text x="1332" y="290" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >11 bloodroot county holdouts</text><circle cx="1315" cy="318" r="4" fill="#142339"/><text x="1332" y="325" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >10 mayapple county holdouts</text><circle cx="1315" cy="353" r="4" fill="#142339"/><text x="1332" y="360" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >County-balanced percentiles</text><circle cx="1315" cy="388" r="4" fill="#142339"/><text x="1332" y="395" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >20,000 county bootstraps</text><circle cx="1315" cy="423" r="4" fill="#142339"/><text x="1332" y="430" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#526476" font-weight="400" >Report contrary results</text><rect x="64" y="504" width="1552" height="54" rx="8" fill="#e9f3f0" stroke="none"/><text x="86" y="539" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#0a887b" font-weight="700" >INTERPRETATION RULES</text><text x="340" y="539" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#142339" font-weight="400" >Not occupancy probabilities   |   No exact observation coordinates   |   No claimed field validation</text></svg>