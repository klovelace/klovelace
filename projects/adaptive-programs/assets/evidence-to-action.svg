<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280"><rect width="1100" height="280" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:18px;font-weight:700}.b{font-size:14px;fill:#475569}.a{font-size:25px;fill:#64748b}</style><text x="35" y="42" class="h" font-size="22">School Food Impact Lab · evidence-to-action loop</text><g><rect x="35" y="85" width="215" height="128" rx="12" fill="#dbeafe"/><text x="52" y="121" class="h">Implementation</text><text x="52" y="150" class="b">Milestones, blockers,</text><text x="52" y="170" class="b">school-level actions</text><text x="260" y="155" class="a">→</text><rect x="292" y="85" width="215" height="128" rx="12" fill="#dcfce7"/><text x="309" y="121" class="h">Student experience</text><text x="309" y="150" class="b">Exposure, selection,</text><text x="309" y="170" class="b">appeal and waste</text><text x="517" y="155" class="a">→</text><rect x="549" y="85" width="215" height="128" rx="12" fill="#fef3c7"/><text x="566" y="121" class="h">Impact evidence</text><text x="566" y="150" class="b">Synthetic control,</text><text x="566" y="170" class="b">sensitivity, uncertainty</text><text x="774" y="155" class="a">→</text><rect x="806" y="85" width="255" height="128" rx="12" fill="#ede9fe"/><text x="823" y="121" class="h">Management feedback</text><text x="823" y="150" class="b">Review evidence, adjust</text><text x="823" y="170" class="b">delivery, learn and repeat</text></g><text x="35" y="253" class="b">Conceptual diagram of the demonstration workflow · all example program data are simulated</text></svg>