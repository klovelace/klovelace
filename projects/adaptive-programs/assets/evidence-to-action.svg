<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="310" viewBox="0 0 1100 310"><rect width="1100" height="310" rx="18" fill="#f8fafc"/><style>text{font-family:Arial,Helvetica,sans-serif;fill:#0f172a}.h{font-size:18px;font-weight:700}.n{font-size:12px;font-weight:700;letter-spacing:.12em;fill:#0e7490}.b{font-size:14px;fill:#475569}.a{font-size:25px;fill:#64748b}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><text x="35" y="42" class="h" font-size="22">School Food Impact Lab · the decision loop</text><g><rect x="35" y="72" width="230" height="138" rx="12" fill="#dbeafe"/><text x="52" y="100" class="n">01</text><text x="52" y="126" class="h">Pinpoint</text><text x="52" y="155" class="b">Find the binding constraint:</text><text x="52" y="175" class="b">availability, not taste</text><text x="273" y="148" class="a">→</text><rect x="303" y="72" width="230" height="138" rx="12" fill="#dcfce7"/><text x="320" y="100" class="n">02</text><text x="320" y="126" class="h">Track</text><text x="320" y="155" class="b">Availability, selection and</text><text x="320" y="175" class="b">student feedback, monthly</text><text x="541" y="148" class="a">→</text><rect x="571" y="72" width="230" height="138" rx="12" fill="#fef3c7"/><text x="588" y="100" class="n">03</text><text x="588" y="126" class="h">Adjust</text><text x="588" y="155" class="b">Barriers become owner-</text><text x="588" y="175" class="b">assigned corrective actions</text><text x="809" y="148" class="a">→</text><rect x="839" y="72" width="226" height="138" rx="12" fill="#ede9fe"/><text x="856" y="100" class="n">04</text><text x="856" y="126" class="h">Verify</text><text x="856" y="155" class="b">Synthetic control, placebo</text><text x="856" y="175" class="b">tests, GHG uncertainty</text></g><path d="M952 212V240H150V218" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/><text x="551" y="262" class="b" text-anchor="middle">Next service cycle: repeat with what was learned</text><text x="35" y="292" class="b">Conceptual diagram of the demonstration workflow · all example program data are simulated</text></svg>
